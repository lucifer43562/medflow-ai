version: '3.8'

services:
  medflow-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medflow_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  medflow-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medflow_dashboard
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    depends_on:
      - medflow-backend
